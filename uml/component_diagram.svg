<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 720" width="100%" height="100%" style="background:#f8fafc;font-family:Segoe UI,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#4f46e5"/></marker>
    <marker id="dbArr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#059669"/></marker>
  </defs>

  <text x="575" y="35" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">COMPONENT DIAGRAM — ARCHITECTURAL TIERS</text>

  <!-- Component 1: Client UI -->
  <g transform="translate(50, 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="230" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="-10" y="20" width="20" height="15" fill="#3b82f6"/>
    <rect x="-10" y="50" width="20" height="15" fill="#3b82f6"/>
    <rect x="0" y="0" width="280" height="35" rx="6" fill="#3b82f6"/>
    <text x="140" y="23" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;&lt;component&gt;&gt; Client Presentation Tier</text>
    <text x="15" y="65" font-size="11" fill="#334155">&#8226; HTML5 / CSS3 Responsive Layout</text>
    <text x="15" y="90" font-size="11" fill="#334155">&#8226; Bootstrap 5 SaaS Theme &amp; Modals</text>
    <text x="15" y="115" font-size="11" fill="#334155">&#8226; Chart.js Interactive Dashboards</text>
    <text x="15" y="140" font-size="11" fill="#334155">&#8226; REST Client (api.js / fetch)</text>
    <text x="15" y="165" font-size="11" fill="#334155">&#8226; Client-Side Date &amp; Form Validation</text>
  </g>

  <!-- Component 2: REST Controllers -->
  <g transform="translate(430, 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="290" height="230" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <rect x="-10" y="20" width="20" height="15" fill="#6366f1"/>
    <rect x="-10" y="50" width="20" height="15" fill="#6366f1"/>
    <rect x="0" y="0" width="290" height="35" rx="6" fill="#6366f1"/>
    <text x="145" y="23" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;&lt;component&gt;&gt; REST API Web Tier</text>
    <text x="15" y="65" font-size="11" fill="#334155">&#8226; AuthController (/api/auth)</text>
    <text x="15" y="90" font-size="11" fill="#334155">&#8226; ApplicationController (/api/applications)</text>
    <text x="15" y="115" font-size="11" fill="#334155">&#8226; InterviewController (/api/.../interviews)</text>
    <text x="15" y="140" font-size="11" fill="#334155">&#8226; DashboardController (/api/dashboard)</text>
    <text x="15" y="165" font-size="11" fill="#334155">&#8226; GlobalExceptionHandler (JSON DTOs)</text>
  </g>

  <!-- Connector: Client to Web -->
  <line x1="330" y1="180" x2="430" y2="180" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr)"/>
  <text x="380" y="170" font-size="10" fill="#4f46e5" font-weight="bold" text-anchor="middle">HTTP/JSON</text>

  <!-- Component 3: Security -->
  <g transform="translate(430, 360)" filter="url(#shadow)">
    <rect x="0" y="0" width="290" height="170" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="-10" y="20" width="20" height="15" fill="#0ea5e9"/>
    <rect x="-10" y="50" width="20" height="15" fill="#0ea5e9"/>
    <rect x="0" y="0" width="290" height="35" rx="6" fill="#0ea5e9"/>
    <text x="145" y="23" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;&lt;component&gt;&gt; Security Subsystem</text>
    <text x="15" y="65" font-size="11" fill="#334155">&#8226; Spring Security 6 Filter Chain</text>
    <text x="15" y="90" font-size="11" fill="#334155">&#8226; BCrypt Password Hashing (Strength 12)</text>
    <text x="15" y="115" font-size="11" fill="#334155">&#8226; CustomUserDetailsService (UserPrincipal)</text>
    <text x="15" y="140" font-size="11" fill="#334155">&#8226; SessionSecurityContextRepository</text>
  </g>
  <line x1="575" y1="300" x2="575" y2="360" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Component 4: Business Services -->
  <g transform="translate(810, 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="290" height="230" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="-10" y="20" width="20" height="15" fill="#8b5cf6"/>
    <rect x="-10" y="50" width="20" height="15" fill="#8b5cf6"/>
    <rect x="0" y="0" width="290" height="35" rx="6" fill="#8b5cf6"/>
    <text x="145" y="23" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;&lt;component&gt;&gt; Business Service Tier</text>
    <text x="15" y="65" font-size="11" fill="#334155">&#8226; AuthService</text>
    <text x="15" y="90" font-size="11" fill="#334155">&#8226; ApplicationService (Validations)</text>
    <text x="15" y="115" font-size="11" fill="#334155">&#8226; InterviewService (Status Transitions)</text>
    <text x="15" y="140" font-size="11" fill="#334155">&#8226; DashboardService (KPIs &amp; Alerts)</text>
    <text x="15" y="165" font-size="11" fill="#334155">&#8226; Jakarta Bean Validation Rules</text>
  </g>
  <line x1="720" y1="180" x2="810" y2="180" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="765" y="170" font-size="10" fill="#8b5cf6" font-weight="bold" text-anchor="middle">Delegates</text>

  <!-- Component 5: Data Access JPA -->
  <g transform="translate(810, 360)" filter="url(#shadow)">
    <rect x="0" y="0" width="290" height="170" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect x="-10" y="20" width="20" height="15" fill="#10b981"/>
    <rect x="-10" y="50" width="20" height="15" fill="#10b981"/>
    <rect x="0" y="0" width="290" height="35" rx="6" fill="#10b981"/>
    <text x="145" y="23" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;&lt;component&gt;&gt; Persistence Tier (JPA)</text>
    <text x="15" y="65" font-size="11" fill="#334155">&#8226; UserRepository</text>
    <text x="15" y="90" font-size="11" fill="#334155">&#8226; ApplicationRepository &amp; Specs</text>
    <text x="15" y="115" font-size="11" fill="#334155">&#8226; InterviewRepository</text>
    <text x="15" y="140" font-size="11" fill="#334155">&#8226; Hibernate 6 ORM Engine</text>
  </g>
  <line x1="955" y1="300" x2="955" y2="360" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Database Tier -->
  <g transform="translate(430, 570)" filter="url(#shadow)">
    <rect x="0" y="0" width="670" height="120" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="335" y="30" font-size="14" font-weight="bold" fill="#065f46" text-anchor="middle">&lt;&lt;database&gt;&gt; MySQL 8.x Server (internship_tracker)</text>
    <line x1="20" y1="45" x2="650" y2="45" stroke="#a7f3d0"/>
    <text x="40" y="75" font-size="12" fill="#047857">&#128193; users (id, full_name, email, password_hash)</text>
    <text x="40" y="95" font-size="12" fill="#047857">&#128193; applications (id, user_id [FK], company_name, job_role, deadline, stipend, status...)</text>
    <text x="40" y="115" font-size="12" fill="#047857">&#128193; interviews (id, application_id [FK CASCADE], interview_round, interview_date...)</text>
  </g>
  <line x1="955" y1="530" x2="955" y2="570" stroke="#059669" stroke-width="2" marker-end="url(#dbArr)"/>
  <text x="965" y="555" font-size="10" fill="#059669" font-weight="bold">JDBC 3306</text>
</svg>