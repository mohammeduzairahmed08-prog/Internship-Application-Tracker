<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 800" width="100%" height="100%" style="background:#f8fafc;font-family:Segoe UI,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#4338ca"/></marker>
  </defs>

  <text x="575" y="35" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">COLLABORATION (COMMUNICATION) DIAGRAM — CORE SYSTEM INTERACTIONS</text>

  <!-- Node 1: ClientUI -->
  <g transform="translate(60, 340)" filter="url(#shadow)">
    <rect width="180" height="70" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="90" y="30" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">1: :ClientUI</text>
    <text x="90" y="52" font-size="11" fill="#64748b" text-anchor="middle">(Browser / SPA)</text>
  </g>

  <!-- Node 2: AuthController -->
  <g transform="translate(420, 100)" filter="url(#shadow)">
    <rect width="190" height="70" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <text x="95" y="30" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">:AuthController</text>
    <text x="95" y="52" font-size="11" fill="#64748b" text-anchor="middle">(Session / BCrypt)</text>
  </g>

  <!-- Node 3: ApplicationController -->
  <g transform="translate(420, 340)" filter="url(#shadow)">
    <rect width="190" height="70" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <text x="95" y="30" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">:ApplicationController</text>
    <text x="95" y="52" font-size="11" fill="#64748b" text-anchor="middle">(REST Endpoints)</text>
  </g>

  <!-- Node 4: InterviewController -->
  <g transform="translate(420, 580)" filter="url(#shadow)">
    <rect width="190" height="70" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <text x="95" y="30" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">:InterviewController</text>
    <text x="95" y="52" font-size="11" fill="#64748b" text-anchor="middle">(Interview Schedule)</text>
  </g>

  <!-- Node 5: ApplicationService -->
  <g transform="translate(760, 340)" filter="url(#shadow)">
    <rect width="190" height="70" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="95" y="30" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">:ApplicationService</text>
    <text x="95" y="52" font-size="11" fill="#64748b" text-anchor="middle">(Business Logic)</text>
  </g>

  <!-- Node 6: ApplicationRepository -->
  <g transform="translate(760, 580)" filter="url(#shadow)">
    <rect width="190" height="70" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="95" y="30" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">:ApplicationRepository</text>
    <text x="95" y="52" font-size="11" fill="#64748b" text-anchor="middle">(Spring Data JPA)</text>
  </g>

  <!-- Node 7: Database -->
  <g transform="translate(760, 100)" filter="url(#shadow)">
    <rect width="190" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="95" y="30" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">:MySQL Database</text>
    <text x="95" y="52" font-size="11" fill="#047857" text-anchor="middle">(internship_tracker)</text>
  </g>

  <!-- Connections -->
  <!-- Client to AuthController -->
  <line x1="240" y1="350" x2="420" y2="150" stroke="#4338ca" stroke-width="2"/>
  <text x="290" y="230" font-size="10" font-weight="bold" fill="#4338ca">1: login(credentials) &#8594;</text>

  <!-- Client to ApplicationController -->
  <line x1="240" y1="375" x2="420" y2="375" stroke="#4338ca" stroke-width="2"/>
  <text x="325" y="365" font-size="10" font-weight="bold" fill="#4338ca" text-anchor="middle">2: createApplication() &#8594;</text>

  <!-- Client to InterviewController -->
  <line x1="240" y1="400" x2="420" y2="600" stroke="#4338ca" stroke-width="2"/>
  <text x="300" y="520" font-size="10" font-weight="bold" fill="#4338ca">3: scheduleInterview() &#8594;</text>

  <!-- ApplicationController to ApplicationService -->
  <line x1="610" y1="375" x2="760" y2="375" stroke="#4338ca" stroke-width="2"/>
  <text x="685" y="365" font-size="10" font-weight="bold" fill="#4338ca" text-anchor="middle">2.1: save(dto) &#8594;</text>

  <!-- ApplicationService to ApplicationRepository -->
  <line x1="855" y1="410" x2="855" y2="580" stroke="#4338ca" stroke-width="2"/>
  <text x="865" y="500" font-size="10" font-weight="bold" fill="#4338ca">2.2: save(entity) &#8595;</text>

  <!-- ApplicationRepository to Database -->
  <path d="M 950 615 C 1050 615, 1050 135, 950 135" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1055" y="380" font-size="10" font-weight="bold" fill="#059669">2.3: SQL INSERT &#8593;</text>
</svg>