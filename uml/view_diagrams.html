<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UML Diagrams Viewer - Internship Application Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }
        .diagram-container { background: #ffffff; border-radius: 12px; padding: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); min-height: 700px; display: flex; align-items: center; justify-content: center; overflow: auto; }
        .nav-pills .nav-link { color: #94a3b8; font-weight: 500; border-radius: 8px; margin: 0 4px; }
        .nav-pills .nav-link.active { background-color: #6366f1; color: #ffffff; }
        .nav-pills .nav-link:hover:not(.active) { color: #ffffff; background-color: #1e293b; }
    </style>
</head>
<body class="p-4">
    <div class="container-fluid max-w-7xl">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
            <div>
                <h3 class="fw-bold mb-1"><i class="bi bi-diagram-3-fill text-primary me-2"></i>Internship Application Tracker — UML Diagrams</h3>
                <p class="text-secondary small mb-0">High-Definition Visual Diagrams &amp; Native StarUML (.mdj) Models</p>
            </div>
            <div class="d-flex gap-2">
                <a href="internship_tracker_all_diagrams.mdj" class="btn btn-outline-light btn-sm"><i class="bi bi-file-earmark-code me-1"></i>Open Master StarUML (.mdj)</a>
                <a href="../Internship_Application_Tracker.zip" class="btn btn-primary btn-sm"><i class="bi bi-download me-1"></i>Download Project ZIP</a>
            </div>
        </div>

        <ul class="nav nav-pills mb-4 justify-content-center" id="diagramTabs" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-target="use_case"><i class="bi bi-people me-1"></i>Use Case</button></li>
            <li class="nav-item"><button class="nav-link" data-target="class"><i class="bi bi-box me-1"></i>Class Diagram</button></li>
            <li class="nav-item"><button class="nav-link" data-target="state"><i class="bi bi-arrow-repeat me-1"></i>State Diagram</button></li>
            <li class="nav-item"><button class="nav-link" data-target="activity"><i class="bi bi-activity me-1"></i>Activity Diagram</button></li>
            <li class="nav-item"><button class="nav-link" data-target="sequence"><i class="bi bi-arrow-down-up me-1"></i>Sequence Diagram</button></li>
            <li class="nav-item"><button class="nav-link" data-target="collaboration"><i class="bi bi-chat-square-dots me-1"></i>Collaboration</button></li>
            <li class="nav-item"><button class="nav-link" data-target="component"><i class="bi bi-cpu me-1"></i>Component Diagram</button></li>
        </ul>

        <div class="diagram-container text-center" id="viewerContent">
            <img src="use_case_diagram.svg" class="img-fluid" id="activeImage" style="max-height:800px;">
        </div>

        <div class="mt-4 p-3 bg-dark rounded border border-secondary text-secondary small text-center">
            Tip: You can right-click on any diagram above and select <strong>"Save image as..."</strong> or <strong>"Open image in new tab"</strong> to export or zoom!
        </div>
    </div>

    <script>
        document.querySelectorAll('#diagramTabs button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#diagramTabs button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const target = btn.getAttribute('data-target');
                document.getElementById('activeImage').src = `${target}_diagram.svg`;
            });
        });
    </script>
</body>
</html>
