<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 780" width="100%" height="100%" style="background:#f8fafc;font-family:Segoe UI,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#4338ca"/></marker>
    <marker id="arrRet" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#64748b"/></marker>
  </defs>

  <text x="575" y="35" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">SEQUENCE DIAGRAM — INTERNSHIP APPLICATION CREATION</text>

  <!-- Participants -->
  <!-- Student -->
  <g transform="translate(60, 60)" filter="url(#shadow)">
    <rect width="120" height="40" rx="6" fill="#4f46e5"/>
    <text x="60" y="25" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">:Student</text>
  </g>
  <line x1="120" y1="100" x2="120" y2="720" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- UI -->
  <g transform="translate(250, 60)" filter="url(#shadow)">
    <rect width="140" height="40" rx="6" fill="#0284c7"/>
    <text x="70" y="25" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">:UI / Dashboard</text>
  </g>
  <line x1="320" y1="100" x2="320" y2="720" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- ApplicationController -->
  <g transform="translate(460, 60)" filter="url(#shadow)">
    <rect width="160" height="40" rx="6" fill="#059669"/>
    <text x="80" y="25" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">:ApplicationController</text>
  </g>
  <line x1="540" y1="100" x2="540" y2="720" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- ApplicationService -->
  <g transform="translate(690, 60)" filter="url(#shadow)">
    <rect width="160" height="40" rx="6" fill="#7c3aed"/>
    <text x="80" y="25" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">:ApplicationService</text>
  </g>
  <line x1="770" y1="100" x2="770" y2="720" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- ApplicationRepository -->
  <g transform="translate(920, 60)" filter="url(#shadow)">
    <rect width="170" height="40" rx="6" fill="#d97706"/>
    <text x="85" y="25" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">:ApplicationRepository</text>
  </g>
  <line x1="1005" y1="100" x2="1005" y2="720" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Activations -->
  <rect x="115" y="130" width="10" height="550" fill="#c7d2fe"/>
  <rect x="315" y="140" width="10" height="530" fill="#bae6fd"/>
  <rect x="535" y="190" width="10" height="440" fill="#a7f3d0"/>
  <rect x="765" y="250" width="10" height="340" fill="#ddd6fe"/>
  <rect x="1000" y="360" width="10" height="150" fill="#fde68a"/>

  <!-- Message 1 -->
  <line x1="125" y1="140" x2="315" y2="140" stroke="#4338ca" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="215" y="132" font-size="11" fill="#1e293b" text-anchor="middle">1: submitForm(appData)</text>

  <!-- Message 2 -->
  <line x1="325" y1="190" x2="535" y2="190" stroke="#4338ca" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="430" y="182" font-size="11" fill="#1e293b" text-anchor="middle">2: POST /api/applications (JSON)</text>

  <!-- Message 3 -->
  <line x1="545" y1="250" x2="765" y2="250" stroke="#4338ca" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="655" y="242" font-size="11" fill="#1e293b" text-anchor="middle">3: createApplication(user, req)</text>

  <!-- Self-call validation -->
  <path d="M 775 280 L 820 280 L 820 310 L 775 310" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="830" y="300" font-size="10" fill="#7c3aed">4: validateDatesAndOwnership()</text>

  <!-- Message 5: save -->
  <line x1="775" y1="360" x2="1000" y2="360" stroke="#4338ca" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="885" y="352" font-size="11" fill="#1e293b" text-anchor="middle">5: save(Application)</text>

  <!-- DB Query -->
  <path d="M 1010 390 L 1050 390 L 1050 420 L 1010 420" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1060" y="410" font-size="10" fill="#d97706">6: INSERT INTO applications</text>

  <!-- Return from Repo -->
  <line x1="1000" y1="510" x2="775" y2="510" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrRet)"/>
  <text x="885" y="502" font-size="10" fill="#64748b" text-anchor="middle">7: savedEntity</text>

  <!-- Return from Service -->
  <line x1="765" y1="590" x2="545" y2="590" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrRet)"/>
  <text x="655" y="582" font-size="10" fill="#64748b" text-anchor="middle">8: ApplicationResponse DTO</text>

  <!-- Return HTTP 201 -->
  <line x1="535" y1="630" x2="325" y2="630" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrRet)"/>
  <text x="430" y="622" font-size="10" fill="#64748b" text-anchor="middle">9: HTTP 201 Created (JSON)</text>

  <!-- UI re-render -->
  <line x1="315" y1="670" x2="125" y2="670" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrRet)"/>
  <text x="215" y="662" font-size="10" fill="#16a34a" font-weight="bold" text-anchor="middle">10: Display Toast &amp; Update List</text>
</svg>