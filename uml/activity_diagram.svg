<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 900" width="100%" height="100%" style="background:#f8fafc;font-family:Segoe UI,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#4338ca"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#dc2626"/></marker>
  </defs>

  <text x="575" y="35" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">ACTIVITY DIAGRAM — INTERNSHIP TRACKING WORKFLOW</text>

  <!-- Initial State -->
  <circle cx="575" cy="70" r="14" fill="#0f172a"/>
  <line x1="575" y1="84" x2="575" y2="120" stroke="#4338ca" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Action: Login / Authenticate -->
  <g transform="translate(475, 120)" filter="url(#shadow)">
    <rect width="200" height="45" rx="22" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <text x="100" y="27" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Authenticate / Login</text>
  </g>
  <line x1="575" y1="165" x2="575" y2="200" stroke="#4338ca" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Decision: Valid Session? -->
  <polygon points="575,200 635,230 575,260 515,230" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="575" y="235" font-size="11" font-weight="bold" fill="#78350f" text-anchor="middle">Authenticated?</text>

  <!-- Invalid auth loop -->
  <line x1="635" y1="230" x2="720" y2="230" stroke="#dc2626" stroke-width="2"/>
  <line x1="720" y1="230" x2="720" y2="142" stroke="#dc2626" stroke-width="2"/>
  <line x1="720" y1="142" x2="675" y2="142" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="730" y="190" font-size="11" fill="#dc2626" font-weight="bold">[No: Invalid Credentials]</text>

  <!-- Valid auth -> Fork -->
  <line x1="575" y1="260" x2="575" y2="300" stroke="#4338ca" stroke-width="2" marker-end="url(#arr)"/>
  <text x="585" y="285" font-size="11" fill="#15803d" font-weight="bold">[Yes: Session Created]</text>

  <!-- Fork Bar -->
  <rect x="150" y="300" width="850" height="8" rx="4" fill="#0f172a"/>

  <!-- Path 1: Manage Applications -->
  <line x1="250" y1="308" x2="250" y2="360" stroke="#4338ca" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(150, 360)" filter="url(#shadow)">
    <rect width="200" height="45" rx="22" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="27" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Create / Edit Application</text>
  </g>
  <line x1="250" y1="405" x2="250" y2="455" stroke="#4338ca" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(150, 455)" filter="url(#shadow)">
    <rect width="200" height="45" rx="22" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="27" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Validate Title &amp; Deadline</text>
  </g>

  <!-- Path 2: Track Interview Round -->
  <line x1="575" y1="308" x2="575" y2="360" stroke="#4338ca" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(475, 360)" filter="url(#shadow)">
    <rect width="200" height="45" rx="22" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="27" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Schedule Interview</text>
  </g>
  <line x1="575" y1="405" x2="575" y2="455" stroke="#4338ca" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(475, 455)" filter="url(#shadow)">
    <rect width="200" height="45" rx="22" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="27" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Record Mode &amp; Meeting Link</text>
  </g>

  <!-- Path 3: Analytics & Reminders -->
  <line x1="900" y1="308" x2="900" y2="360" stroke="#4338ca" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(800, 360)" filter="url(#shadow)">
    <rect width="200" height="45" rx="22" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="27" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Query KPI Statistics</text>
  </g>
  <line x1="900" y1="405" x2="900" y2="455" stroke="#4338ca" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(800, 455)" filter="url(#shadow)">
    <rect width="200" height="45" rx="22" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="27" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Compute 7-Day Deadlines</text>
  </g>

  <!-- Join Bar -->
  <line x1="250" y1="500" x2="250" y2="550" stroke="#4338ca" stroke-width="2"/>
  <line x1="575" y1="500" x2="575" y2="550" stroke="#4338ca" stroke-width="2"/>
  <line x1="900" y1="500" x2="900" y2="550" stroke="#4338ca" stroke-width="2"/>
  <rect x="150" y="550" width="850" height="8" rx="4" fill="#0f172a"/>

  <!-- Persist / Update Database -->
  <line x1="575" y1="558" x2="575" y2="600" stroke="#4338ca" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(450, 600)" filter="url(#shadow)">
    <rect width="250" height="45" rx="22" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="125" y="27" font-size="12" font-weight="bold" fill="#065f46" text-anchor="middle">Commit Transactions to MySQL</text>
  </g>

  <!-- Re-render UI & Chart.js -->
  <line x1="575" y1="645" x2="575" y2="690" stroke="#4338ca" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(450, 690)" filter="url(#shadow)">
    <rect width="250" height="45" rx="22" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="125" y="27" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="middle">Refresh Dashboard &amp; Chart.js</text>
  </g>

  <!-- Final State -->
  <line x1="575" y1="735" x2="575" y2="780" stroke="#4338ca" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="575" cy="800" r="16" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="575" cy="800" r="10" fill="#0f172a"/>
  <text x="575" y="835" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Workflow Complete</text>
</svg>