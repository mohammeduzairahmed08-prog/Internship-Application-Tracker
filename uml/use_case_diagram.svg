<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background:#f8fafc;font-family:Segoe UI,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
    <linearGradient id="subjGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
    <linearGradient id="ucGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e0e7ff"/><stop offset="100%" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="actorGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4f46e5"/><stop offset="100%" stop-color="#3730a3"/></linearGradient>
  </defs>

  <!-- Title -->
  <text x="600" y="32" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">USE CASE DIAGRAM — INTERNSHIP APPLICATION TRACKER</text>

  <!-- System Boundary -->
  <rect x="280" y="55" width="640" height="820" rx="10" fill="url(#subjGrad)" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="280" y="55" width="640" height="35" rx="10" fill="#6366f1"/>
  <rect x="280" y="75" width="640" height="15" fill="#6366f1"/>
  <text x="600" y="78" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">SYSTEM BOUNDARY: INTERNSHIP APPLICATION TRACKER</text>

  <!-- Left Actor: Student -->
  <g transform="translate(100, 380)">
    <circle cx="40" cy="20" r="16" fill="#ffffff" stroke="#4f46e5" stroke-width="3"/>
    <line x1="40" y1="36" x2="40" y2="75" stroke="#4f46e5" stroke-width="3"/>
    <line x1="15" y1="50" x2="65" y2="50" stroke="#4f46e5" stroke-width="3"/>
    <line x1="40" y1="75" x2="15" y2="115" stroke="#4f46e5" stroke-width="3"/>
    <line x1="40" y1="75" x2="65" y2="115" stroke="#4f46e5" stroke-width="3"/>
    <rect x="-20" y="125" width="120" height="24" rx="4" fill="#4f46e5"/>
    <text x="40" y="141" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Student / Applicant</text>
  </g>

  <!-- Right Actor: System Scheduler -->
  <g transform="translate(1000, 220)">
    <circle cx="40" cy="20" r="16" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <line x1="40" y1="36" x2="40" y2="75" stroke="#f59e0b" stroke-width="3"/>
    <line x1="15" y1="50" x2="65" y2="50" stroke="#f59e0b" stroke-width="3"/>
    <line x1="40" y1="75" x2="15" y2="115" stroke="#f59e0b" stroke-width="3"/>
    <line x1="40" y1="75" x2="65" y2="115" stroke="#f59e0b" stroke-width="3"/>
    <rect x="-30" y="125" width="140" height="24" rx="4" fill="#f59e0b"/>
    <text x="40" y="141" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">System Scheduler</text>
  </g>

  <!-- Right Actor: Interviewer -->
  <g transform="translate(1000, 560)">
    <circle cx="40" cy="20" r="16" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
    <line x1="40" y1="36" x2="40" y2="75" stroke="#10b981" stroke-width="3"/>
    <line x1="15" y1="50" x2="65" y2="50" stroke="#10b981" stroke-width="3"/>
    <line x1="40" y1="75" x2="15" y2="115" stroke="#10b981" stroke-width="3"/>
    <line x1="40" y1="75" x2="65" y2="115" stroke="#10b981" stroke-width="3"/>
    <rect x="-25" y="125" width="130" height="24" rx="4" fill="#10b981"/>
    <text x="40" y="141" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Company Interviewer</text>
  </g>

  <!-- Associations lines from Student -->
  <line x1="180" y1="430" x2="350" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="180" y1="430" x2="350" y2="205" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="180" y1="430" x2="350" y2="275" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="180" y1="430" x2="350" y2="345" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="180" y1="430" x2="350" y2="415" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="180" y1="430" x2="350" y2="485" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="180" y1="430" x2="350" y2="555" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="180" y1="430" x2="350" y2="625" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="180" y1="430" x2="350" y2="765" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="180" y1="430" x2="350" y2="835" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Associations lines from Scheduler -->
  <line x1="1000" y1="270" x2="850" y2="695" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="1000" y1="270" x2="850" y2="765" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Associations lines from Interviewer -->
  <line x1="1000" y1="610" x2="850" y2="555" stroke="#10b981" stroke-width="1.5"/>
  <line x1="1000" y1="610" x2="850" y2="625" stroke="#10b981" stroke-width="1.5"/>

  <!-- Use Cases (Ellipses) -->
  <g transform="translate(600, 135)"><ellipse cx="0" cy="0" rx="180" ry="24" fill="url(#ucGrad)" stroke="#4338ca" stroke-width="1.5"/><text x="0" y="5" font-size="12" font-weight="600" fill="#1e1b4b" text-anchor="middle">Register &amp; Sign In (BCrypt Authentication)</text></g>
  <g transform="translate(600, 205)"><ellipse cx="0" cy="0" rx="180" ry="24" fill="url(#ucGrad)" stroke="#4338ca" stroke-width="1.5"/><text x="0" y="5" font-size="12" font-weight="600" fill="#1e1b4b" text-anchor="middle">Manage Candidate Profile</text></g>
  <g transform="translate(600, 275)"><ellipse cx="0" cy="0" rx="180" ry="24" fill="url(#ucGrad)" stroke="#4338ca" stroke-width="1.5"/><text x="0" y="5" font-size="12" font-weight="600" fill="#1e1b4b" text-anchor="middle">Create Internship Application (Validates Dates)</text></g>
  <g transform="translate(600, 345)"><ellipse cx="0" cy="0" rx="180" ry="24" fill="url(#ucGrad)" stroke="#4338ca" stroke-width="1.5"/><text x="0" y="5" font-size="12" font-weight="600" fill="#1e1b4b" text-anchor="middle">Search &amp; Filter Applications (Role/Mode/Date)</text></g>
  <g transform="translate(600, 415)"><ellipse cx="0" cy="0" rx="180" ry="24" fill="url(#ucGrad)" stroke="#4338ca" stroke-width="1.5"/><text x="0" y="5" font-size="12" font-weight="600" fill="#1e1b4b" text-anchor="middle">View Application Details &amp; Personal Notes</text></g>
  <g transform="translate(600, 485)"><ellipse cx="0" cy="0" rx="180" ry="24" fill="url(#ucGrad)" stroke="#4338ca" stroke-width="1.5"/><text x="0" y="5" font-size="12" font-weight="600" fill="#1e1b4b" text-anchor="middle">Update Application Status (Wishlist &#8594; Offer)</text></g>
  <g transform="translate(600, 555)"><ellipse cx="0" cy="0" rx="180" ry="24" fill="url(#ucGrad)" stroke="#4338ca" stroke-width="1.5"/><text x="0" y="5" font-size="12" font-weight="600" fill="#1e1b4b" text-anchor="middle">Schedule Interview Round (Virtual Link / Notes)</text></g>
  <g transform="translate(600, 625)"><ellipse cx="0" cy="0" rx="180" ry="24" fill="url(#ucGrad)" stroke="#4338ca" stroke-width="1.5"/><text x="0" y="5" font-size="12" font-weight="600" fill="#1e1b4b" text-anchor="middle">Record Interview Outcome (Passed / Failed)</text></g>
  <g transform="translate(600, 695)"><ellipse cx="0" cy="0" rx="200" ry="24" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="0" y="5" font-size="12" font-weight="600" fill="#78350f" text-anchor="middle">Monitor Deadlines &amp; Overdue Alerts (&lt;= 7 Days)</text></g>
  <g transform="translate(600, 765)"><ellipse cx="0" cy="0" rx="190" ry="24" fill="url(#ucGrad)" stroke="#4338ca" stroke-width="1.5"/><text x="0" y="5" font-size="12" font-weight="600" fill="#1e1b4b" text-anchor="middle">Analyze Dashboard KPIs &amp; Success Trends</text></g>
  <g transform="translate(600, 835)"><ellipse cx="0" cy="0" rx="190" ry="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="0" y="5" font-size="12" font-weight="600" fill="#991b1b" text-anchor="middle">Delete Application (Cascade Interviews)</text></g>
</svg>