# ========================================================
# Test Configuration - H2 In-Memory Database (MySQL Mode)
# ========================================================

spring.application.name=internship-application-tracker-test

# In-memory H2 database running in MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:internshiptracker_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# DDL Auto create-drop for clean isolated tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false
